name: lakehouse

services:
  kafka:
    image: apache/kafka:3.9.1
    ports: ["${KAFKA_PORT:-16092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-16092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    mem_limit: 1g
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list
      interval: 5s
      timeout: 20s
      retries: 20

  postgres:
    image: postgres:17-alpine
    ports: ["${PG_PORT:-16432}:5432"]
    environment:
      POSTGRES_USER: lakehouse
      POSTGRES_PASSWORD: lakehouse
      POSTGRES_DB: lakehouse
    command: postgres -c shared_buffers=256MB -c max_wal_size=2GB
    mem_limit: 1g
    healthcheck:
      test: pg_isready -U lakehouse
      interval: 2s
      retries: 30

  # The pipeline, the tests and dbt. Runs next to the brokers on the compose
  # network, so nothing depends on host port forwarding.
  app:
    profiles: [app]
    build: .
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      PG_DSN: postgresql://lakehouse:lakehouse@postgres:5432/lakehouse
      LAKE_DIR: /work/data/lake
      WAREHOUSE: /work/data/warehouse.duckdb
    volumes: [".:/work"]
    mem_limit: 2g
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
